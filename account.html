<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Firebase Account</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="shell"><div class="minihero"><div class="logo"><i>Z</i>XKAI</div><div class="subtitle">Device Management Console</div></div>
<section class="panel formpanel"><div class="back"><a href="/">‹</a><h1>New Firebase Account</h1></div>
<label>SCRIPT / CONFIG FILE</label><div class="upload" id="drop"><div class="uploadicon">⇧</div><strong id="fileName">Upload Script File</strong><small>JS, JSON, TXT, HTML, XML or PHP</small><input id="script" type="file" accept=".js,.json,.txt,.html,.htm,.xml,.php" hidden></div>
<label>FRIENDLY LABEL (OPTIONAL)</label><input id="label" placeholder="e.g. My Project"><p class="hint">The demo reads only the selected file in your browser and extracts number-like values. It does not read SMS/OTP.</p>
<div class="actions"><button class="save" id="go">⚡ Upload &amp; Show Result</button><a class="cancel" href="/">Cancel</a></div></section></div>
<script src="/app.js"></script></body></html>
