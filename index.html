<!DOCTYPE html><html lang="en">
<body style="background: #040912; color: white; font-family: Inter, sans-serif;">
    <div id="universe-bg">
        <!-- Background blobs and stars (Visuals only) -->
        <span class="u-blob"></span><span class="u-blob"></span><span class="u-blob"></span><span class="u-fog"></span>
        <!-- Stars would be here -->
    </div>
    
    <div id="root">
        <div class="min-h-screen text-white flex flex-col" style="background: rgba(4, 9, 18, 0.55);">
            <div class="border-b border-[#1a2530]" style="background: rgba(6, 12, 20, 0.5);">
                <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center gap-6 flex-wrap">
                    <div class="flex items-center gap-5">
                        <div><p class="text-[9px] uppercase tracking-widest text-[#444] font-semibold">Total</p><p class="text-lg font-black text-white">0</p></div>
                        <div><p class="text-[9px] uppercase tracking-widest text-[#444] font-semibold">Online</p><p class="text-lg font-black text-emerald-400">0</p></div>
                        <div><p class="text-[9px] uppercase tracking-widest text-[#444] font-semibold">Offline</p><p class="text-lg font-black text-[#555]">0</p></div>
                        <div><p class="text-[9px] uppercase tracking-widest text-[#444] font-semibold">Bank SMS</p><p class="text-lg font-black text-emerald-400">0</p></div>
                    </div>
                    <div class="ml-auto flex items-center gap-2 flex-wrap">
                        <button class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-red-600/20 text-red-400 border border-red-600/30">all</button>
                        <button class="px-3 py-1.5 rounded-lg text-xs font-semibold text-[#555]">online</button>
                        <button class="px-3 py-1.5 rounded-lg text-xs font-semibold text-[#555]">offline</button>
                        <button class="px-3 py-1.5 rounded-lg text-xs font-semibold text-[#555]">saved</button>
                        <button class="px-3 py-1.5 rounded-lg text-xs font-semibold text-[#555]">upi</button>
                        <button class="px-3 py-1.5 rounded-lg text-xs font-semibold text-[#555]">bank</button>
                        <button class="px-3 py-1.5 rounded-lg text-xs font-semibold text-[#555]">card</button>
                        <div class="w-px h-4 bg-[#222]"></div>
                        <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-purple-400 bg-purple-600/20 border border-purple-600/30">SMS</button>
                        <div class="w-px h-4 bg-[#222]"></div>
                        <select class="bg-[#111] border border-[#222] text-xs text-[#666] rounded-lg px-2 py-1.5">
                            <option value="new">Newest</option>
                            <option value="old">Oldest</option>
                            <option value="name">Name</option>
                            <option value="battery">Battery</option>
                        </select>
                    </div>
                </div>
            </div>
            <main class="flex-1 max-w-screen-2xl mx-auto w-full px-6 py-6">
                <div>
                    <div class="flex items-center gap-3 mb-5">
                        <div class="w-4 h-4 border-2 border-[#333] border-t-red-500 rounded-full animate-spin"></div>
                        <span class="text-sm text-[#555]">Connecting to Firebase…</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
                        <!-- Skeleton loaders (Pulse effect) -->
                        <div class="bg-[#111111] border border-[#1f1f1f] rounded-2xl p-4 animate-pulse">
                            <div class="flex items-start gap-3 mb-3">
                                <div class="w-10 h-10 rounded-xl bg-[#1a1a1a]"></div>
                                <div class="flex-1 space-y-2">
                                    <div class="h-3 bg-[#1a1a1a] rounded w-3/4"></div>
                                    <div class="h-2 bg-[#151515] rounded w-1/2"></div>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3 mb-3">
                                <div class="h-8 bg-[#151515] rounded-xl"></div>
                                <div class="h-8 bg-[#151515] rounded-xl"></div>
                            </div>
                            <div class="h-10 bg-[#131313] rounded-xl"></div>
                        </div>
                        <!-- More skeleton loaders would repeat here -->
                    </div>
                </div>
            </main>
        </div>
