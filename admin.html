<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORISS IPInfo • Admin</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#f4f7f5;margin:0;color:#10231a}
.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:white;border:1px solid #dce8df;border-radius:18px;padding:24px;box-shadow:0 10px 30px #0a24120d}
h1{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,button{padding:13px;border-radius:10px;border:1px solid #cbd9d0;font-size:15px}button{cursor:pointer;background:#123d2a;color:white;border:0}.muted{color:#66766d;font-size:14px}.out{white-space:pre-wrap;background:#f4f7f5;padding:15px;border-radius:12px;margin-top:15px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>ORISS IPInfo API</h1>
<p class="muted">Admin key generator. Keep this page private and protect it with your own admin token.</p>
<div class="grid">
<input id="token" placeholder="ADMIN_TOKEN">
<input id="name" placeholder="Customer / Bot name">
<input id="credits" type="number" min="1" placeholder="Credits">
<button onclick="createKey()">Generate API Key</button>
</div>
<div id="out" class="out">Ready.</div>
</div></div>
<script>
async function createKey(){
 const out=document.getElementById('out');
 out.textContent='Generating...';
 const r=await fetch('/api/admin/create',{
   method:'POST',headers:{'Content-Type':'application/json','x-admin-token':document.getElementById('token').value},
   body:JSON.stringify({name:document.getElementById('name').value,credits:Number(document.getElementById('credits').value)})
 });
 out.textContent=await r.text();
}
</script></body></html>
